<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>Tatu University Restaurant Menu</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #121212;
      display: flex;
      justify-content: center;
      align-items: center; /* Centers vertically */
      min-height: 100vh;
      min-height: 100dvh;  /* Adapts to mobile dynamic browser bars */
      padding: 12px;
    }
    .menu-wrapper {
      width: 100%;
      max-width: 1200px;
      margin: auto;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .menu-image {
      width: 100%;
      max-height: 95vh;
      max-height: 95dvh;
      object-fit: contain;
      display: block;
      margin: 0 auto;
      border-radius: 6px;
      cursor: zoom-in;
    }

    @media (min-width: 768px) {
      body {
        padding: 24px 16px;
      }
      .menu-image {
        border-radius: 8px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      }
    }
  </style>
</head>
<body>
  <div class="menu-wrapper">
    <a href="./taturestaurant.png" target="_blank" rel="noopener noreferrer" style="display: inline-block; width: 100%; text-align: center;">
      <img 
        class="menu-image" 
        src="./taturestaurant.png" 
        alt="Tatu University Restaurant Menu - World Talent Conference 2026"
      >
    </a>
  </div>
</body>
</html>
