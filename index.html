<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Allows users to pinch-to-zoom on phones to read smaller price details -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>Tatu University Restaurant Menu</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #121212;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 0;
    }
    .menu-wrapper {
      width: 100%;
      /* Expands fully on mobile, caps cleanly on large desktop displays */
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      justify-content: center;
    }
    .menu-image {
      /* Fits full width of mobile screens */
      width: 100%;
      height: auto;
      display: block;
      object-fit: contain;
      cursor: zoom-in;
    }

    /* Desktop polish */
    @media (min-width: 768px) {
      body {
        padding: 24px 16px;
      }
      .menu-image {
        border-radius: 8px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      }
    }
  </style>
</head>
<body>
  <div class="menu-wrapper">
    <!-- Click on desktop will open high-res original in new tab -->
    <a href="./taturestaurant.png" target="_blank" rel="noopener noreferrer" style="width: 100%; display: block;">
      <img 
        class="menu-image" 
        src="./taturestaurant.png" 
        alt="Tatu University Restaurant Menu - World Talent Conference 2026"
      >
    </a>
  </div>
</body>
</html>
