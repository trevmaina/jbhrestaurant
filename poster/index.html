<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tatu University Restaurant - QR Menu Poster</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&family=Oswald:wght@700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #1a1a1a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Montserrat', sans-serif;
      padding: 20px;
    }

    .poster {
      width: 100%;
      max-width: 480px;
      aspect-ratio: 1 / 1.414; /* A5 proportion */
      background-color: #7a1518 !important;
      border-radius: 12px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.4);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 40px 24px;
      text-align: center;
      color: #ffffff !important;
      position: relative;
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
    }

    .header-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .main-title {
      font-family: 'Oswald', sans-serif;
      font-size: 3.4rem;
      letter-spacing: 2px;
      line-height: 1;
      text-transform: uppercase;
      font-weight: 700;
      color: #ffffff !important;
    }

    .subtitle {
      font-size: 1.2rem;
      letter-spacing: 2px;
      font-weight: 800;
      text-transform: uppercase;
      color: #f1f5f9 !important;
    }

    /* Enlarged QR Frame */
    .qr-frame {
      position: relative;
      padding: 22px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 10px 0;
    }

    .corner {
      position: absolute;
      width: 48px;
      height: 48px;
      border-color: #ffffff !important;
      border-style: solid;
      border-width: 0;
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
    }
    .top-left     { top: 0; left: 0; border-top-width: 6px; border-left-width: 6px; }
    .top-right    { top: 0; right: 0; border-top-width: 6px; border-right-width: 6px; }
    .bottom-left  { bottom: 0; left: 0; border-bottom-width: 6px; border-left-width: 6px; }
    .bottom-right { bottom: 0; right: 0; border-bottom-width: 6px; border-right-width: 6px; }

    .qr-image-wrapper {
      background: #ffffff !important;
      padding: 16px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      display: flex;
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
    }

    /* Screen view QR size */
    .qr-image-wrapper img {
      width: 250px;
      height: 250px;
      display: block;
      object-fit: contain;
    }

    .footer-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .restaurant-name {
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #ffffff !important;
    }

    .event-tag {
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.8px;
      color: #fca5a5 !important;
      text-transform: uppercase;
    }

    /* Print Specific Sizing */
    @media print {
      @page {
        margin: 0;
        size: A5 portrait;
      }
      body {
        background: transparent !important;
        padding: 0;
        margin: 0;
        display: block;
        width: 148mm;
        height: 210mm;
      }
      .poster {
        width: 148mm;
        height: 210mm;
        max-width: none;
        border-radius: 0;
        box-shadow: none;
        padding: 18mm 14mm;
        page-break-after: avoid;
        page-break-inside: avoid;
      }

      /* Big, clear QR Code for table scans */
      .qr-image-wrapper img {
        width: 76mm !important;
        height: 76mm !important;
      }

      .corner {
        width: 18mm;
        height: 18mm;
        border-width: 0;
      }
      .top-left     { border-top-width: 2.5mm; border-left-width: 2.5mm; }
      .top-right    { border-top-width: 2.5mm; border-right-width: 2.5mm; }
      .bottom-left  { border-bottom-width: 2.5mm; border-left-width: 2.5mm; }
      .bottom-right { border-bottom-width: 2.5mm; border-right-width: 2.5mm; }

      .main-title {
        font-size: 38pt;
      }
      .subtitle {
        font-size: 14pt;
      }
      .restaurant-name {
        font-size: 13pt;
      }
      .event-tag {
        font-size: 9pt;
      }
    }
  </style>
</head>
<body>

  <div class="poster">
    <div class="header-section">
      <h1 class="main-title">SCAN HERE</h1>
      <p class="subtitle">TO VIEW OUR MENU</p>
    </div>

    <div class="qr-frame">
      <div class="corner top-left"></div>
      <div class="corner top-right"></div>
      <div class="corner bottom-left"></div>
      <div class="corner bottom-right"></div>

      <div class="qr-image-wrapper">
        <img src="https://raw.githubusercontent.com/trevmaina/jbhrestaurant/poster/qrcode.png" alt="Scan to view Tatu University Restaurant Menu">
      </div>
    </div>

    <div class="footer-section">
      <div class="restaurant-name">TATU UNIVERSITY RESTAURANT</div>
      <div class="event-tag">World Talent Conference 2026 • Main Campus Kisumu</div>
    </div>
  </div>

</body>
</html>
